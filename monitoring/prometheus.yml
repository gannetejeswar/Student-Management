global:
  scrape_interval: 15s
scrape_configs:
  - job_name: student-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["student-service:8080"]
  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8080"]
  - job_name: audit-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["audit-service:8080"]
